<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="780" fill="#101014"/>

  <!-- Nav rail WITH labels -->
  <rect x="0" y="0" width="150" height="780" fill="#16161c"/>
  <text x="20" y="40" fill="#4a9eff" font-size="14" font-weight="bold">Skippy</text>
  <g fill="#9a9aa5" font-size="13">
    <rect x="10" y="62" width="130" height="30" rx="6" fill="#26262e"/>
    <text x="20" y="82" fill="#e8e8ec">⌂ Home</text>
    <text x="20" y="122">▦ Agenda</text>
    <text x="20" y="158">$ Finance</text>
    <text x="20" y="194">☑ Review</text>
    <rect x="88" y="180" width="22" height="17" rx="8" fill="#e8a33d"/>
    <text x="93" y="193" fill="#101014" font-size="11" font-weight="bold">20</text>
    <text x="20" y="230">◉ Brain</text>
    <text x="20" y="266">▤ Projects</text>
    <text x="20" y="720">⚙ Settings</text>
  </g>
  <text x="12" y="300" fill="#5a5a66" font-size="10">count badge = things waiting on you</text>

  <!-- NOW: calm empty state, NO buttons -->
  <rect x="175" y="25" width="760" height="70" rx="10" fill="#1a1a20" stroke="#2a2a32"/>
  <text x="195" y="50" fill="#3ecf8e" font-size="11" letter-spacing="2">NOW</text>
  <text x="195" y="76" fill="#e8e8ec" font-size="20">All clear — nothing needs you right now ✨</text>
  <text x="700" y="76" fill="#5a5a66" font-size="11">(no fake to-do, no buttons)</text>

  <!-- Quick capture -->
  <rect x="175" y="115" width="760" height="130" rx="10" fill="#1a1a20" stroke="#2a2a32"/>
  <text x="195" y="142" fill="#e8e8ec" font-size="15" font-weight="bold">✎ Quick capture</text>
  <rect x="700" y="126" width="90" height="26" rx="13" fill="#26262e"/>
  <text x="714" y="143" fill="#e8e8ec" font-size="12">Act on it</text>
  <rect x="796" y="126" width="94" height="26" rx="13" fill="#16161c" stroke="#2a2a32"/>
  <text x="810" y="143" fill="#9a9aa5" font-size="12">Just save it</text>
  <rect x="195" y="158" width="720" height="48" rx="8" fill="#111116" stroke="#2a2a32"/>
  <text x="210" y="186" fill="#5a5a66" font-size="13">Drop a thought, note, URL, or file…</text>
  <text x="195" y="228" fill="#9a9aa5" font-size="11">"Act on it" = Skippy may create tasks/notes from this · "Just save it" = stored untouched</text>

  <!-- Agenda preview: grouped + deduped -->
  <rect x="175" y="265" width="760" height="270" rx="10" fill="#1a1a20" stroke="#2a2a32"/>
  <text x="195" y="292" fill="#e8e8ec" font-size="15" font-weight="bold">▦ Next up</text>
  <text x="845" y="292" fill="#4a9eff" font-size="12">Open Agenda →</text>

  <text x="195" y="322" fill="#9a9aa5" font-size="11" letter-spacing="1">TODAY</text>
  <rect x="195" y="332" width="720" height="44" rx="8" fill="#111116"/>
  <text x="210" y="352" fill="#e8e8ec" font-size="13">📅 6:30 PM · Norwalk Film Festival — "The Best Summer"</text>
  <text x="232" y="369" fill="#9a9aa5" font-size="11">Cedar Point Yacht Club, Westport CT</text>
  <text x="770" y="356" fill="#5a5a66" font-size="10">(one row — deduped)</text>

  <text x="195" y="404" fill="#9a9aa5" font-size="11" letter-spacing="1">SAT, SEP 5</text>
  <rect x="195" y="414" width="720" height="34" rx="8" fill="#111116"/>
  <text x="210" y="436" fill="#e8e8ec" font-size="13">🔁 GEICO auto-pay processes</text>

  <text x="195" y="476" fill="#9a9aa5" font-size="11" letter-spacing="1">TUE, SEP 8</text>
  <rect x="195" y="486" width="720" height="34" rx="8" fill="#111116"/>
  <text x="210" y="508" fill="#e8e8ec" font-size="13">☐ Submit Biddle v. Disney claim</text>
  <rect x="820" y="492" width="60" height="20" rx="10" fill="#26262e"/>
  <text x="832" y="506" fill="#9a9aa5" font-size="11">due</text>

  <!-- Needs your review: plain language -->
  <rect x="175" y="555" width="760" height="150" rx="10" fill="#1a1a20" stroke="#2a2a32"/>
  <text x="195" y="582" fill="#e8e8ec" font-size="15" font-weight="bold">Needs your review</text>

  <rect x="195" y="596" width="720" height="44" rx="8" fill="#111116"/>
  <rect x="208" y="608" width="28" height="20" rx="10" fill="#e8a33d"/>
  <text x="216" y="622" fill="#101014" font-size="11" font-weight="bold">16</text>
  <text x="248" y="622" fill="#e8e8ec" font-size="13">finds waiting for a yes or no</text>
  <rect x="820" y="604" width="80" height="28" rx="14" fill="#26262e"/>
  <text x="838" y="623" fill="#e8e8ec" font-size="12">Review</text>

  <rect x="195" y="648" width="720" height="44" rx="8" fill="#111116"/>
  <rect x="208" y="660" width="24" height="20" rx="10" fill="#e8a33d"/>
  <text x="215" y="674" fill="#101014" font-size="11" font-weight="bold">4</text>
  <text x="248" y="674" fill="#e8e8ec" font-size="13">things Skippy wants to do — approve?</text>
  <rect x="820" y="656" width="80" height="28" rx="14" fill="#2b4a6e"/>
  <text x="835" y="675" fill="#e8e8ec" font-size="12">Approve</text>

  <text x="175" y="745" fill="#5a5a66" font-size="11">Wireframe — structure and copy tone only. Existing dark theme + type carries over.</text>
</svg>
